<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Born to Serve - Hub</title>
    
    <!-- Google Fonts for styled typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Mali:wght@700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Background Canvas -->
    <div class="page-container">
        
        <!-- Top Navigation Header -->
        <header class="top-nav">
            <button class="nav-btn hub-btn" data-target="index.html">Hub</button>
        </header>

        <!-- Main Content Layout -->
        <main class="content-wrapper">
            
            <!-- Left Column: Title & About Box -->
            <div class="left-section">
                <!-- Title Block with Paint Splatters -->
                <div class="title-container">
                    <div class="splatter red-splatter"></div>
                    <div class="splatter yellow-splatter"></div>
                    <div class="splatter green-splatter"></div>
                    <h1 class="main-title">BORN TO<br>SERVE</h1>
                </div>

                <!-- Gradient About Box -->
                <div class="about-card">
                    <h2 class="about-title">About This<br>Site</h2>
                    <p class="about-text">
                        This is a site for Youth Pastors, Kids Church Teachers, and anyone wanting to teach young and new Christians in a fun way.
                    </p>
                    <p class="about-text">
                        This site is a tool giving over ___ activities, lessons as well as examples of ministry for children up to young adults to enjoy.
                    </p>
                </div>
            </div>

            <!-- Right Column: Navigation Cloud Buttons -->
            <div class="right-section">
                <button class="cloud-btn activities-btn" data-target="activities.html">
                    <span class="sparkle left-sparkle">✦</span>
                    <span class="btn-text">ACTIVITIES</span>
                    <span class="sparkle right-sparkle">★</span>
                </button>

                <button class="cloud-btn ministries-btn" data-target="ministries.html">
                    <span class="sparkle left-sparkle">✦</span>
                    <span class="btn-text">MINISTRIES</span>
                    <span class="sparkle right-sparkle">★</span>
                </button>

                <button class="cloud-btn lessons-btn" data-target="lessons.html">
                    <span class="sparkle left-sparkle">✦</span>
                    <span class="btn-text">LESSONS</span>
                    <span class="sparkle right-sparkle">★</span>
                </button>
            </div>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
